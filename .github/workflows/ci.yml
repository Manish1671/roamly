name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roamly
          POSTGRES_PASSWORD: roamly
          POSTGRES_DB: roamly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roamly -d roamly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @roamly/shared --filter @roamly/geo-contracts --filter @roamly/itinerary-engine run build

      - name: Generate Prisma client
        run: pnpm --filter @roamly/api exec prisma generate
        env:
          SESSION_SECRET: 0123456789012345678901234567890123456789012345678901234567890
          DATABASE_URL: postgresql://roamly:roamly@localhost:5432/roamly?schema=public

      - name: Apply database migrations
        run: pnpm --filter @roamly/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://roamly:roamly@localhost:5432/roamly?schema=public

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          SESSION_SECRET: 0123456789012345678901234567890123456789012345678901234567890
          DATABASE_URL: postgresql://roamly:roamly@localhost:5432/roamly?schema=public
          NODE_ENV: test
          API_PORT: 3001
          CORS_ORIGINS: http://localhost:3000

      - name: Build
        run: pnpm build
        env:
          SESSION_SECRET: 0123456789012345678901234567890123456789012345678901234567890
          DATABASE_URL: postgresql://roamly:roamly@localhost:5432/roamly?schema=public
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
