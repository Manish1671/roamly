services:
  postgres:
    image: postgres:16-alpine
    container_name: roamly-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roamly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roamly}
      POSTGRES_DB: ${POSTGRES_DB:-roamly}
    volumes:
      - roamly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roamly} -d ${POSTGRES_DB:-roamly}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  roamly_postgres_data:
